[project]
name = "proximal-lq"
version = "0.2.2"
description = "Fast solver for simplex-constrained linear least squares optimization"
authors = [{name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "optimization",
    "proximal",
    "simplex",
    "least-squares",
    "portfolio",
    "convex",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4.6",
]

[project.urls]
Homepage = "https://github.com/tschm/proximal"
Documentation = "https://tschm.github.io/proximal/"
Repository = "https://github.com/tschm/proximal"
Issues = "https://github.com/tschm/proximal/issues"
Changelog = "https://github.com/tschm/proximal/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "marimo==0.23.16",
    "matplotlib==3.11.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
]
test = [
    "pytest>=9.1.1",
    # 6.112 is the floor that works on the full Python matrix: hypothesis < ~6.29
    # calls the removed importlib.metadata EntryPoints.get() and crashes on 3.12+
    # (surfaced by the lowest-direct CI resolution). hypothesis is test-only, so
    # a modern floor costs library consumers nothing.
    "hypothesis>=6.164.0",
]

[build-system]
# hatchling 1.32.0 emits Metadata-Version: 2.5, which the twine pinned inside
# hynek/build-and-inspect-python-package v2.18.0 (used by the rhiza CI
# generate-matrix job) rejects: "'2.5' is not a valid metadata version".
# Current twine/packaging accept 2.5, so drop this bound once the CI action
# ships a newer twine.
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proximal_lq"]

[tool.marimo.runtime]
pythonpath = ["src"]

[tool.deptry.package_module_name_map]
numpy = "numpy"
marimo = "marimo"
matplotlib = "matplotlib"
pandas = "pandas"
plotly = "plotly"
pytest = "pytest"
