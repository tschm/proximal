[project]
name = 'proximal-lq'
version = "0.0.0"
description = "Solving constrained linear least squares"
authors = [{name='Thomas Schmelzer', email= 'thomas.schmelzer@gmail.com'}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
]

[project.urls]
repository = "https://github.com/tschm/proximal"

[project.optional-dependencies]
dev = [
    "pre-commit==4.3.0",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "marimo==0.15.2",
    "matplotlib==3.10.6",
    "pandas==2.3.2",
    "go-task-bin"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proximal_lq"]

[tool.deptry]
# see https://deptry.com/usage/#pep-621-dev-dependency-groups
pep621_dev_dependency_groups = ["dev"]
