[project]
name = "proximal-lq"
version = "0.1.2"
description = "Fast solver for simplex-constrained linear least squares optimization"
authors = [{name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "optimization",
    "proximal",
    "simplex",
    "least-squares",
    "portfolio",
    "convex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/tschm/proximal"
Documentation = "https://tschm.github.io/proximal/"
Repository = "https://github.com/tschm/proximal"
Issues = "https://github.com/tschm/proximal/issues"
Changelog = "https://github.com/tschm/proximal/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "marimo==0.19.2",
    "matplotlib==3.10.8",
    "pandas>=2.3",
    "plotly>=6.5",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proximal_lq"]

[tool.marimo.runtime]
pythonpath = ["src"]
