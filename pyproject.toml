[project]
name = 'proximal-lq'
version = "0.0.0"
description = "Solving constrained linear least squares"
authors = [{name='Thomas Schmelzer', email= 'thomas.schmelzer@gmail.com'}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
]

[project.urls]
repository = "https://github.com/tschm/proximal"

[dependency-groups]
dev = [
    "marimo==0.19.2",
    "matplotlib==3.10.8",
    "pandas>=2.3",
    "plotly>=6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proximal_lq"]
