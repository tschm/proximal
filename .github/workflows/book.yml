name: "book"

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  marimo:
    runs-on: "ubuntu-latest"
    steps:
      - uses: jebel-quant/marimushka@v0.1.4
        with:
          notebooks: 'book/marimo'

  pdoc:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Build the virtual environment for ${{ github.repository }}"
        uses: tschm/cradle/actions/environment@v0.3.01

      - uses: tschm/cradle/actions/pdoc@v0.3.01
        with:
          source-folder: 'src/proximal_lq'

  test:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Build the virtual environment for ${{ github.repository }}"
        uses: tschm/cradle/actions/environment@v0.3.01

      - uses: tschm/cradle/actions/coverage@v0.3.01
        with:
          source-folder: 'src/proximal'
          tests-folder: 'src/tests'
          coveralls: 'false'

  book:
    runs-on: "ubuntu-latest"
    needs: [test, pdoc, marimo]

    environment:
      name: github-pages

    permissions:
      pages: write
      id-token: write

    steps:
      - uses: tschm/cradle/actions/book@v0.3.01
        with:
          title: 'Proximal'
          links: |
            {
              "API": "./pdoc/index.html"
              "Coverage":"./tests/html-coverage/index.html",
              "Tests":"./tests/html-report/report.html"
            }
