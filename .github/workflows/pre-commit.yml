name: pre-commit

permissions:
  contents: read

on:
  push:

jobs:
  deptry:
    runs-on: ubuntu-latest

    steps:
      - name: "Build the virtual environment for ${{ github.repository }}"
        uses: cvxgrp/.github/actions/environment@v2.2.8

      - uses: tschm/cradle/actions/deptry@v0.1.55
        with:
          source-folder: 'src/proximal'

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: tschm/cradle/actions/pre-commit@v0.1.55
